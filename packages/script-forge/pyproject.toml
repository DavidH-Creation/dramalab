[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "script-forge"
version = "0.1.0"
description = "Iterative screenplay optimizer using LLM-as-judge loop"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9",
    "python-docx>=1.0",
    "rich>=13.0",
]

[project.scripts]
script-forge = "script_forge.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires Claude CLI (deselect with '-m not integration')",
]
