[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-studio"
version = "0.1.0"
description = "Web UI for creative-writing optimization tools"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "python-docx>=1.0",
    "typer>=0.9",
    "sse-starlette>=2.0",
    "script-forge>=0.1.0",
]

[project.scripts]
forge-studio = "forge_studio.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
